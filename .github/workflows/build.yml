name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s /Applications/Xcode_26.app
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          # Use the newest available iOS runtime's first iPhone, so the job doesn't depend on device names.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")], reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project IOSMediaPlayer.xcodeproj \
            -scheme IOSMediaPlayer \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath derived_data \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7

  build:
    name: Build and Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s /Applications/Xcode_26.app
          xcodebuild -version

      - name: Build Application for iOS Device
        run: |
          xcodebuild clean build \
            -project IOSMediaPlayer.xcodeproj \
            -scheme IOSMediaPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r derived_data/Build/Products/Release-iphoneos/IOSMediaPlayer.app Payload/
          zip -r -q IOSMediaPlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSMediaPlayer-ipa
          path: IOSMediaPlayer.ipa
          retention-days: 14
